# CI-based SonarQube Cloud analysis (.github/workflows/sonarcloud.yml).
sonar.organization=pocmatos
sonar.projectKey=pmatos_jsse
sonar.projectName=jsse

sonar.sourceEncoding=UTF-8
# Production code only: src/**, the node-mode host scripts (scripts/node-*.js) and the workflows.
sonar.exclusions=test262-extra/**,tests/**,fuzz/**,.clusterfuzzlite/**,.claude/**,docs/**,benches/**,benchmarks/**,research/**,ts-suite/**,symphonika/**,node-lib/**,scripts/**/*.py,scripts/**/*.sh,scripts/libs/**,scripts/*-fixtures/**,scripts/gen-*,scripts/gen_*,scripts/patch-*,scripts/zod-*,scripts/node-test-*.js,scripts/*.selftest.js
sonar.cpd.exclusions=test262-extra/**,tests/**,fuzz/**,.clusterfuzzlite/**,.claude/**,docs/**,benches/**,benchmarks/**,research/**,ts-suite/**,symphonika/**,node-lib/**,scripts/**/*.py,scripts/**/*.sh,scripts/libs/**,scripts/*-fixtures/**,scripts/gen-*,scripts/gen_*,scripts/patch-*,scripts/zod-*,scripts/node-test-*.js,scripts/*.selftest.js
