[package]
name = "jsse-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.jsse]
path = ".."
default-features = false

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "differential"
path = "fuzz_targets/differential.rs"
test = false
doc = false
bench = false

[[bin]]
name = "execute"
path = "fuzz_targets/execute.rs"
test = false
doc = false
bench = false

[[bin]]
name = "typed_array"
path = "fuzz_targets/typed_array.rs"
test = false
doc = false
bench = false

[[bin]]
name = "gc_stress"
path = "fuzz_targets/gc_stress.rs"
test = false
doc = false
bench = false
