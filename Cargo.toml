[package]
name = "jsse"
version = "0.11.0"
edition = "2024"

[features]
default = ["jemalloc"]
# Opt-in execution counters for performance investigations (issue #526).
# Off by default so the shipped binary carries no counter writes.
perf-counters = []
# jemalloc as the shipped binary's global allocator (issue #1047). The
# `#[global_allocator]` lives in src/main.rs only, so the library, unit tests,
# miri and fuzz targets keep the system allocator. Build with
# `--no-default-features` for allocator-sensitive profiling (valgrind
# dhat/memcheck heap tools). The dependency is not resolved on Windows or wasm.
jemalloc = ["dep:tikv-jemallocator"]

[target.'cfg(not(any(windows, target_family = "wasm")))'.dependencies]
tikv-jemallocator = { version = "0.7", optional = true }

[dependencies]
clap = { version = "4", features = ["derive"] }
num-bigint = "0.5"
unicode-ident = "1.0"
regex = "1"
# Direct use of the meta engine: the `regex` crate cannot run an anchored search
# at an arbitrary start offset, which a sticky RegExp match needs. Features
# mirror what `regex` enables by default so the shared build is unchanged.
regex-automata = { version = "0.4", default-features = false, features = ["std", "syntax", "meta", "nfa-pikevm", "nfa-backtrack", "dfa-onepass", "hybrid", "perf-literal", "unicode"] }
fancy-regex = "0.19"
chrono = "0.4"
ryu-js = "1.0.2"
iana-time-zone = "0.1"
chrono-tz = "0.10"
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }
icu = { version = "2.0", features = ["experimental"] }
icu_calendar = { version = "2.0", features = ["unstable"] }
# ICU4X 2's semantic field sets have one shared text length. ICU4X 1.5 retains
# the classical per-field skeleton matcher used only to select mixed-width patterns.
icu_datetime_legacy = { package = "icu_datetime", version = "=1.5.1", features = ["experimental"] }
icu_provider_legacy = { package = "icu_provider", version = "=1.5.0" }
fixed_decimal = { version = "0.7", features = ["ryu"] }
tinystr = "0.8"
icu_normalizer = "2.1.1"
writeable = "0.6"
rustc-hash = "2"
# Randomly seeded fast hasher for property-key maps (not for identifier/binding
# maps, which need the keyed SipHash of #393).
foldhash = "0.2"
smallvec = "1"
getrandom = "0.4"

# Shipped build: fat LTO and one codegen unit, +6.4% JetStream 3 score geomean
# and -5.9% micro-suite wall time for ~2.5-3x crate build time (issue #935;
# docs/perf/2026-10-14/935-fat-lto.md). AGENTS.md ("Building") has the
# env-var override for quick local iteration.
[profile.release]
lto = "fat"
codegen-units = 1

# Release speed without the full-crate LTO relink, for binaries built only to be
# tested (`cargo test --release` would LTO-relink the bin and every integration
# test): CI unit tests, the mutation-testing oracle, release-checked.
[profile.release-nolto]
inherits = "release"
lto = false
codegen-units = 16

# Release-speed build with debug assertions on, so test262 runs execute the
# GC root-stack discipline checks (issue #331). Build with
# `cargo build --profile release-checked`; the binary lands in
# target/release-checked/. Recursion and parse-depth limits key off
# `cfg!(debug_assertions)`, so this binary runs with the debug-sized limits;
# do not run the recursion-limit custom tests (tests/recursion-limit-*.js)
# against it.
[profile.release-checked]
inherits = "release-nolto"
debug-assertions = true

[dev-dependencies]
divan = { version = "5.0.3", package = "codspeed-divan-compat" }

[[bench]]
name = "engine"
harness = false
