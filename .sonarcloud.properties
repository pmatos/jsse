# Automatic Analysis reads this file; sonar-project.properties is ignored.
# Only production code is analysed: src/** and the host scripts under scripts/.
sonar.exclusions=test262-extra/**,tests/**,fuzz/**,docs/**,benches/**,benchmarks/**,research/**,ts-suite/**,symphonika/**,node-lib/**,scripts/*-fixtures/**,scripts/run-*.sh,scripts/test_*.py,scripts/*.selftest.js
sonar.cpd.exclusions=test262-extra/**,tests/**,fuzz/**,docs/**,benches/**,benchmarks/**,research/**,ts-suite/**,symphonika/**,node-lib/**,scripts/*-fixtures/**,scripts/run-*.sh,scripts/test_*.py,scripts/*.selftest.js
