version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # CodeQL sub-actions share a versioned configuration and must move together.
    groups:
      codeql:
        patterns:
          - github/codeql-action/*
    commit-message:
      prefix: ci
    open-pull-requests-limit: 5
