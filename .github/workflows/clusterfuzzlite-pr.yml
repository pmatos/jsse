# Blocking code-change fuzzing of the parse, execute, typed_array and reentrancy targets under AddressSanitizer.
# Fuzz time is capped at 120 s and shared between the targets; the ASan build is extra. See README.md "Fuzzing".

name: ClusterFuzzLite PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Build fuzzers (ASan)
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          sanitizer: address
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run fuzzers (code-change, 120 s)
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          mode: code-change
          sanitizer: address
          fuzz-seconds: 120
          output-sarif: false
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clusterfuzzlite-pr-crashes
          path: out/artifacts/
          if-no-files-found: ignore
