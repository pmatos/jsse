# Enforces that PR titles follow the same Conventional Commits rules as pushes.
# https://www.conventionalcommits.org/  |  https://commitlint.js.org/
name: Lint PR title

on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  validate:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      # pull_request_target checks out the trusted base branch by default. Never
      # override this with the pull request's head ref: commitlint loads and
      # executes commitlint.config.cjs from the checkout.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
      - name: Install commitlint
        run: npm install --no-save @commitlint/cli@21 @commitlint/config-conventional@21
      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # Lint the bare title so the squash suffix cannot mask a trailing full
        # stop, then lint the exact header GitHub will create so the suffix is
        # included in commitlint's 100-character limit.
        run: |
          printf '%s\n' "$PR_TITLE" | npx --no-install commitlint --config commitlint.config.cjs --verbose
          printf '%s (#%s)\n' "$PR_TITLE" "$PR_NUMBER" | npx --no-install commitlint --config commitlint.config.cjs --verbose
