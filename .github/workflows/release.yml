name: Release

# Releases are cut by semantic-release on a weekly batch schedule (Sundays
# 00:00 UTC): it derives the next version from Conventional Commit types
# accumulated on main since the last release, builds the Linux `jsse`
# binary, and publishes a GitHub Release (notes + CHANGELOG + tarball +
# checksums). No-op if nothing releasable landed that week. Use
# workflow_dispatch to cut a release on demand between scheduled runs.
#
# Self-healing: every run first reconciles the latest vX.Y.Z tag against its
# GitHub Release (see .github/semantic-release/reconcile-release.sh) so a
# prior run's post-tag publish/asset-upload failure is repaired against the
# existing tag before semantic-release considers cutting a new one.
on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch: {}

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
      - name: Reconcile release assets
        run: bash .github/semantic-release/reconcile-release.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run semantic-release
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          extra_plugins: |
            @semantic-release/changelog@6
            @semantic-release/git@10
            @semantic-release/exec@7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
