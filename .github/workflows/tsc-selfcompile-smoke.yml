name: tsc self-compile smoke

# Compiles a generated 60-module program with typescript 6.0.3 on Node and on
# `jsse --node` and requires byte-identical output within the RSS budget of
# scripts/tsc-fixtures/selfcompile-budget.json (#1249). About 15 s of tsc on
# jsse. Deliberately a separate workflow from ci.yml: it needs an npm download,
# so it must never gate the required `build` check. The full cases run nightly
# in nightly-tsc-selfcompile.yml.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "node-lib/**"
      - "scripts/node-*.js"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/run-tsc-selfcompile-oracle.py"
      - "scripts/tsc-fixtures/selfcompile-budget.json"
      - ".github/workflows/tsc-selfcompile-smoke.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "node-lib/**"
      - "scripts/node-*.js"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/run-tsc-selfcompile-oracle.py"
      - "scripts/tsc-fixtures/selfcompile-budget.json"
      - ".github/workflows/tsc-selfcompile-smoke.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  TYPESCRIPT_VERSION: 6.0.3

permissions:
  contents: read

# Only PR pushes cancel each other; every commit on main keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # The smoke case peaks at about 2.4x Node, far below the 6x cap, so the
      # slow fat-LTO link buys nothing here (the nightly job uses the shipped profile).
      - name: Build
        env:
          CARGO_PROFILE_RELEASE_LTO: "off"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: cargo build --release

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.11.0

      - name: Install typescript
        run: npm install --prefix "$RUNNER_TEMP/tsc" "typescript@${TYPESCRIPT_VERSION}" --ignore-scripts --no-audit --no-fund

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Self-compile smoke (generated program)
        env:
          TSC_DIR: ${{ runner.temp }}/tsc/node_modules/typescript
        run: uv run python scripts/run-tsc-selfcompile-oracle.py --smoke --require --ci --jsse ./target/release/jsse --timeout 1500
