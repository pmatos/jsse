name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  TEST262_SAMPLE_SEED: 262023

# Least-privilege default for all jobs; widen per-job only when needed.
permissions:
  contents: read

# Cancel superseded runs on the same ref (a new push obsoletes in-flight CI).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Install cargo-nextest
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: nextest

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Clippy (perf-counters feature)
        run: cargo clippy --features perf-counters -- -D warnings

      - name: Build
        run: cargo build --release

      - name: Run unit tests
        run: cargo nextest run --release

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Run Python script tests
        run: uv run python -m unittest discover -s scripts -p 'test_*.py'

      - name: Run test262 smoke set
        run: |
          uv run python scripts/run-test262.py --jsse ./target/release/jsse --test262 ./test262 \
            test262/test/built-ins/Atomics/ \
            test262/test/built-ins/SharedArrayBuffer/ \
            test262/test/language/module-code/ \
            test262/test/language/expressions/dynamic-import/usage/ \
            test262/test/language/expressions/dynamic-import/namespace/ \
            test262/test/language/expressions/dynamic-import/import-attributes/

      - name: Run test262 (10% sample, fixed seed ${{ env.TEST262_SAMPLE_SEED }})
        run: uv run python scripts/run-test262.py --jsse ./target/release/jsse --test262 ./test262 --sample 0.1 --seed "$TEST262_SAMPLE_SEED"

      # test262-extra is first-party (every file added deliberately by us,
      # not an upstream corpus that evolves out from under us like
      # test262/), so unlike the steps above it is gated on zero failures
      # rather than on regressions against a baseline.
      - name: Run test262-extra
        run: uv run python scripts/run-test262.py --jsse ./target/release/jsse --test262 ./test262 test262-extra/ --fail-on-failures

      - name: Run test262-extra (bytecode VM)
        run: uv run python scripts/run-test262.py --jsse ./target/release/jsse --test262 ./test262 test262-extra/ --bytecode --fail-on-failures

      # The checked profile keeps debug assertions on at release speed, so the
      # GC temp-root stack discipline (strict LIFO release, balanced native
      # calls, jobs and runs; #331) is executed by real test262 workloads.
      - name: Build (release-checked)
        run: cargo build --profile release-checked

      - name: Run unit tests (release-checked, debug assertions on)
        run: cargo nextest run --cargo-profile release-checked

      - name: Run test262-extra (GC root-stack assertions)
        run: uv run python scripts/run-test262.py --jsse ./target/release-checked/jsse --test262 ./test262 test262-extra/ --fail-on-failures

      - name: Run test262-extra (GC root-stack assertions, bytecode VM)
        run: uv run python scripts/run-test262.py --jsse ./target/release-checked/jsse --test262 ./test262 test262-extra/ --bytecode --fail-on-failures

      - name: Run test262 (10% sample, GC root-stack assertions)
        run: uv run python scripts/run-test262.py --jsse ./target/release-checked/jsse --test262 ./test262 --sample 0.1 --seed "$TEST262_SAMPLE_SEED"

      # JSSE_GC_STRESS forces a collection at every Nth safepoint that would
      # not otherwise collect, turning missing-root/write-barrier bugs into
      # reproducible test262-extra failures (#331, #809). Reuses the plain
      # release binary built above.
      - name: Run test262-extra (GC stress, JSSE_GC_STRESS=7)
        run: JSSE_GC_STRESS=7 uv run python scripts/run-test262.py --jsse ./target/release/jsse --test262 ./test262 test262-extra/ --timeout 300 --fail-on-failures

      - name: Run test262-extra (GC stress, JSSE_GC_STRESS=7, bytecode VM)
        run: JSSE_GC_STRESS=7 uv run python scripts/run-test262.py --jsse ./target/release/jsse --test262 ./test262 test262-extra/ --bytecode --timeout 300 --fail-on-failures

