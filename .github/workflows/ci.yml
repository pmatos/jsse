name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  TEST262_SAMPLE_SEED: 262023

# Least-privilege default for all jobs; widen per-job only when needed.
permissions:
  contents: read

# Cancel superseded runs on the same ref (a new push obsoletes in-flight CI).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Clippy (perf-counters feature)
        run: cargo clippy --features perf-counters -- -D warnings

      - name: Build
        run: cargo build --release

      - name: Run unit tests
        run: cargo nextest run --release

      - uses: astral-sh/setup-uv@v7

      - name: Run Python script tests
        run: uv run python -m unittest discover -s scripts -p 'test_*.py'

      - name: Run test262 smoke set
        run: |
          uv run python scripts/run-test262.py --jsse ./target/release/jsse --test262 ./test262 \
            test262/test/built-ins/Atomics/ \
            test262/test/built-ins/SharedArrayBuffer/ \
            test262/test/language/module-code/ \
            test262/test/language/expressions/dynamic-import/usage/ \
            test262/test/language/expressions/dynamic-import/namespace/ \
            test262/test/language/expressions/dynamic-import/import-attributes/

      - name: Run test262 (10% sample, fixed seed ${{ env.TEST262_SAMPLE_SEED }})
        run: uv run python scripts/run-test262.py --jsse ./target/release/jsse --test262 ./test262 --sample 0.1 --seed "$TEST262_SAMPLE_SEED"

      # test262-extra is first-party (every file added deliberately by us,
      # not an upstream corpus that evolves out from under us like
      # test262/), so unlike the steps above it is gated on zero failures
      # rather than on regressions against a baseline.
      - name: Run test262-extra
        run: uv run python scripts/run-test262.py --jsse ./target/release/jsse --test262 ./test262 test262-extra/ --fail-on-failures

      - name: Run test262-extra (bytecode VM)
        run: uv run python scripts/run-test262.py --jsse ./target/release/jsse --test262 ./test262 test262-extra/ --bytecode --fail-on-failures
