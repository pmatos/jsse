# Nightly differential fuzzing (jsse vs node). It stays outside ClusterFuzzLite
# because the target needs node and a release build of jsse. Parser fuzzing
# runs in the clusterfuzzlite-*.yml workflows. See README.md "Fuzzing" and
# docs/adr/0004-fuzz-lib-target-and-subprocess-differential.md.

name: Fuzz

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  differential:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .
            fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Build release jsse (differential target's other engine)
        run: cargo build --release

      - name: Fuzz differential (new mutations, 5 min budget)
        run: cargo +nightly fuzz run differential --sanitizer none -- -max_total_time=300 -timeout=30 fuzz/corpus/differential

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: differential-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
