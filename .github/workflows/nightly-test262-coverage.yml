name: Nightly test262 Coverage

on:
  schedule:
    # Run every 5 days at 02:00 UTC (1st, 6th, 11th, 16th, 21st, 26th, 31st)
    - cron: "0 2 */5 * *"
  workflow_dispatch: # Allow manual triggers

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@ea647c55f74bb153499600c054578c0d83fa19d5 # cargo-llvm-cov

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Generate coverage from full test262 suite
        run: |
          # shellcheck disable=SC1090 # sourcing dynamic cargo-llvm-cov env export
          source <(cargo llvm-cov show-env --export-prefix)
          cargo llvm-cov clean --workspace
          cargo build --release
          cargo test --release
          uv run python scripts/run-test262.py --jsse ./target/release/jsse --test262 ./test262
          cargo llvm-cov report --release --lcov --output-path lcov.info

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: pmatos/jsse
          flags: nightly-test262
          name: nightly-test262-full
