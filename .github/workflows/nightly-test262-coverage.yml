name: Nightly test262 Coverage

on:
  schedule:
    # Run every 5 days at 02:00 UTC (1st, 6th, 11th, 16th, 21st, 26th, 31st)
    - cron: "0 2 */5 * *"
  workflow_dispatch: # Allow manual triggers

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-llvm-cov

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Generate coverage from full test262 suite
        run: |
          # shellcheck disable=SC1090 # sourcing dynamic cargo-llvm-cov env export
          source <(cargo llvm-cov show-env --export-prefix)
          cargo llvm-cov clean --workspace
          cargo build --release
          cargo test --release
          uv run python scripts/run-test262.py --jsse ./target/release/jsse --test262 ./test262
          cargo llvm-cov report --release --lcov --output-path lcov.info

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: pmatos/jsse
          flags: nightly-test262
          name: nightly-test262-full
