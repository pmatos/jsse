name: Nightly test262 Coverage

on:
  schedule:
    # Run every 5 days at 02:00 UTC (1st, 6th, 11th, 16th, 21st, 26th, 31st)
    - cron: "0 2 */5 * *"
  workflow_dispatch: # Allow manual triggers

env:
  CARGO_TERM_COLOR: always
  # Coverage instrumentation does not need the shipped fat-LTO release profile.
  CARGO_PROFILE_RELEASE_LTO: "off"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Generate coverage from full test262 suite
        run: |
          # shellcheck disable=SC1090 # sourcing dynamic cargo-llvm-cov env export
          source <(cargo llvm-cov show-env --export-prefix)
          cargo llvm-cov clean --workspace
          cargo build --release
          cargo test --release
          uv run python scripts/run-test262.py --jsse ./target/release/jsse --test262 ./test262
          cargo llvm-cov report --release --lcov --output-path lcov.info

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: pmatos/jsse
          flags: nightly-test262
          name: nightly-test262-full
