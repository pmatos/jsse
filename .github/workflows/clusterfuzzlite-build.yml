# Uploads an ASan build of main so ClusterFuzzLite PR runs can tell a crash the
# PR introduced from one already present on main (the latter is not reported).

name: ClusterFuzzLite build

on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Build fuzzers (ASan)
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          sanitizer: address
          upload-build: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
